name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: NDK
        run: |
          NDK=$(sed -n 's/.*ndkVersion *= *"\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "Installing NDK $NDK"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null

      - name: Signing key
        run: |
          # The release variant is signed with the machine's Android debug key and refuses to
          # build without one. CI's key is its own, so what it produces is not installable over
          # a published build -- but it does prove the shipping configuration compiles and packages.
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "C=US, O=Android, CN=Android Debug"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Modem gate
        run: |
          g++ -O2 -std=c++17 \
              -I app/src/main/cpp \
              -I app/src/main/cpp/ggwave/src \
              -I app/src/main/cpp/ggwave/include \
              tools/bench.cpp \
              app/src/main/cpp/sotto_modem.cpp \
              app/src/main/cpp/ggwave/src/ggwave.cpp \
              -o /tmp/bench
          # Fails the build if any cell decodes below its floor.
          /tmp/bench gate 40
          # And the full comparison table, for the record.
          /tmp/bench

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          # Not the published build: this one carries CI's own signing key, so it installs on a
          # clean phone but not over a copy of Sotto from the releases page.
          name: sotto-apk-ci-signed
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
